<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Imprezy Masowe – FORT</title>

  <meta name="apple-mobile-web-app-title" content="Imprezy FORT" />
  <meta name="theme-color" content="#0f172a" />
  <link id="apple-icon" rel="apple-touch-icon" href="icon.png" />
  <link id="favicon-icon" rel="icon" type="image/png" href="icon.png" />

  <script>
    window.addEventListener("error", function (e) {
      var el = document.getElementById("auth-error");
      if (el) {
        el.style.color = "#fca5a5";
        el.textContent = "Błąd aplikacji: " + (e.message || "nieznany błąd skryptu");
      }
    });
    window.addEventListener("unhandledrejection", function (e) {
      var el = document.getElementById("auth-error");
      if (el && e.reason) {
        el.style.color = "#fca5a5";
        el.textContent = "Błąd połączenia: " + (e.reason.message || e.reason);
      }
    });
  </script>

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273549;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --safe-top: env(safe-area-inset-top, 12px);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-top: var(--safe-top);
      padding-bottom: calc(88px + var(--safe-bottom));
      min-height: 100vh;
    }

    /* Ekran logowania */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      padding: 24px;
      text-align: center;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 390px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    .auth-logo {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, #1d4ed8, #0f172a);
      border: 1.5px solid #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 1px;
      color: #60a5fa;
    }

    .btn-google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 18px;
      margin-top: 20px;
      background: #ffffff;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-google:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .btn-google:active:not(:disabled) {
      transform: scale(0.98);
    }

    .redirect-fallback-btn {
      margin-top: 14px;
      background: transparent;
      border: none;
      color: #93c5fd;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      padding: 6px;
    }

    /* Nagłówek aplikacji */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      max-width: 760px;
      margin: 0 auto;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
      flex-shrink: 0;
    }

    .sync-dot.online { background: var(--success); }
    .sync-dot.error { background: var(--danger); }

    .drive-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
    }

    .drive-pill.connected {
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
    }

    .drive-pill.expired {
      border-color: rgba(245, 158, 11, 0.55);
      background: rgba(245, 158, 11, 0.18);
      color: #fcd34d;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .search-bar {
      max-width: 760px;
      margin: 10px auto 0;
    }

    .search-bar input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--primary);
    }

    /* Zakładki */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 12px 16px 4px;
      max-width: 760px;
      margin: 0 auto;
    }

    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 6px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .tab-count {
      font-size: 11px;
      opacity: 0.9;
    }

    /* Lista kart */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px 16px;
    }

    .migration-banner {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid var(--primary);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    @keyframes pulseDanger {
      0%, 100% {
        border-color: #ef4444;
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45);
      }
      50% {
        border-color: #fca5a5;
        box-shadow: 0 0 14px 2px rgba(239, 68, 68, 0.65);
      }
    }

    @keyframes badgeBlink {
      0%, 100% { background-color: #dc2626; color: #ffffff; }
      50% { background-color: #7f1d1d; color: #fecaca; }
    }

    .card.urgent {
      animation: pulseDanger 1.4s infinite;
      border-width: 2px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .card-meta {
      font-size: 13px;
      color: var(--text-muted);
    }

    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-ok { background: rgba(16, 185, 129, 0.18); color: #34d399; }
    .badge-warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-urgent { animation: badgeBlink 1.1s infinite; }
    .badge-done { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }

    .deadlines-box {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 12px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .deadline-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .opinions-section-label {
      font-size: 12px;
      color: var(--text-muted);
      margin: 12px 0 6px;
      font-weight: 600;
    }

    .opinions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    @media (max-width: 420px) {
      .opinions-grid {
        grid-template-columns: 1fr;
      }
    }

    .opinion-slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 11px;
      font-size: 13px;
      min-height: 44px;
    }

    .opinion-slot.uploaded {
      border-color: rgba(16, 185, 129, 0.55);
      background: rgba(16, 185, 129, 0.12);
    }

    .opinion-name {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .opinion-name span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .slot-controls {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .plus-upload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid rgba(59, 130, 246, 0.65);
      background: rgba(59, 130, 246, 0.22);
      color: #93c5fd;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }

    .plus-upload-btn:active {
      transform: scale(0.94);
      background: var(--primary);
      color: #ffffff;
    }

    .plus-upload-btn.small {
      width: 26px;
      height: 26px;
      font-size: 16px;
    }

    .file-view-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 7px;
      background: rgba(16, 185, 129, 0.22);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .file-remove-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
    }

    .decision-box {
      margin-top: 10px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.42);
      padding: 10px 12px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .decision-box.completed {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.45);
    }

    .archived-files-list {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .btn-sm {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-danger {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: calc(20px + var(--safe-bottom));
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      font-size: 30px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.5);
      cursor: pointer;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 50;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      padding: 20px 20px calc(24px + var(--safe-bottom));
      max-height: 92vh;
      overflow-y: auto;
    }

    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; }
      .modal { border-radius: 20px; border: 1px solid var(--border); }
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
    }

    #upload-toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(88px + var(--safe-bottom));
      max-width: 520px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid var(--primary);
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(96, 165, 250, 0.25);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <input
    type="file"
    id="hidden-file-input"
    accept="image/*,application/pdf,.pdf,.jpg,.jpeg,.png,.heic,.webp"
    class="hidden"
  />

  <!-- EKRAN LOGOWANIA -->
  <section id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">FORT</div>
      <h1 style="margin: 0 0 8px; font-size: 22px;">Imprezy Masowe</h1>
      <p style="margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.5;">
        Zaloguj się kontem Google, aby synchronizować terminy oraz zapisywać skany opinii i decyzji na Dysku Google.
      </p>
      <button id="login-btn" type="button" class="btn-google">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="login-btn-text">Zaloguj przez Google</span>
      </button>
      <div>
        <button id="redirect-login-btn" type="button" class="redirect-fallback-btn">
          Zaloguj metodą przekierowania (bez wyskakującego okna)
        </button>
      </div>
      <p id="auth-error" style="color: #fca5a5; font-size: 13px; margin-top: 14px; line-height: 1.45;"></p>
    </div>
  </section>

  <!-- GŁÓWNA APLIKACJA -->
  <div id="app-shell" class="hidden">
    <header>
      <div class="header-top">
        <div>
          <h1 class="header-title">Imprezy Masowe</h1>
          <div class="status-row">
            <div class="sync-status">
              <span id="sync-dot" class="sync-dot"></span>
              <span id="sync-text">Łączenie...</span>
            </div>
            <button id="drive-status-btn" type="button" class="drive-pill" title="Status połączenia z Dyskiem Google">
              Dysk Google: sprawdź
            </button>
          </div>
        </div>
        <div class="header-actions">
          <button id="notif-btn" type="button" class="icon-btn" title="Powiadomienia">🔔</button>
          <button id="export-btn" type="button" class="icon-btn" title="Pobierz kopię JSON">⬇️</button>
          <button id="logout-btn" type="button" class="icon-btn" title="Wyloguj">Wyloguj</button>
        </div>
      </div>
      <div class="search-bar">
        <input type="search" id="search-input" placeholder="Szukaj imprezy, obiektu lub uwag..." />
      </div>
    </header>

    <nav class="tabs">
      <button type="button" class="tab-btn active" data-tab="do_zlozenia">
        <span>Do złożenia</span>
        <span class="tab-count" id="count-do_zlozenia">0</span>
      </button>
      <button type="button" class="tab-btn" data-tab="zlozone">
        <span>Złożone</span>
        <span class="tab-count" id="count-zlozone">0</span>
      </button>
      <button type="button" class="tab-btn" data-tab="zakonczone">
        <span>Zakończone</span>
        <span class="tab-count" id="count-zakonczone">0</span>
      </button>
    </nav>

    <main>
      <div id="migration-banner" class="migration-banner hidden">
        <span>Wykryto lokalne zapisy na tym urządzeniu.</span>
        <button id="migrate-btn" type="button" class="btn-sm btn-primary">Wyślij do chmury</button>
      </div>

      <div id="events-list"></div>
    </main>

    <button id="add-btn" type="button" class="fab" aria-label="Dodaj imprezę">+</button>
  </div>

  <!-- POWIADOMIENIE O WYSYŁANIU / ODNAWIANIU SESJI DYSKU -->
  <div id="upload-toast" class="hidden">
    <div style="display:flex; align-items:center; gap:10px;">
      <div id="upload-spinner" class="spinner"></div>
      <span id="upload-status-text">Wysyłanie pliku na Dysk Google...</span>
    </div>
    <button id="upload-reauth-btn" type="button" class="btn-sm btn-primary hidden">
      Połącz Dysk i wyślij
    </button>
  </div>

  <!-- MODAL DODAWANIA / EDYCJI -->
  <div id="event-modal" class="modal-backdrop">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 id="modal-title" style="margin:0; font-size:18px;">Nowa impreza masowa</h2>
        <button id="close-modal" type="button" class="icon-btn">✕</button>
      </div>
      <form id="event-form">
        <input type="hidden" id="edit-id" />
        <div class="form-group">
          <label for="f-name">Nazwa imprezy *</label>
          <input type="text" id="f-name" required placeholder="np. Koncert – ERGO ARENA" />
        </div>
        <div class="form-group">
          <label for="f-location">Obiekt / Miasto</label>
          <input type="text" id="f-location" placeholder="np. Gdańsk / Szczecin" />
        </div>
        <div class="form-group">
          <label for="f-eventDate">Data imprezy *</label>
          <input type="date" id="f-eventDate" required />
        </div>
        <div class="form-group">

      if (!targetDate) return 0;

    async function driveFetch(url, options, token) {
      const res = await fetch(url, {
        ...options,
        headers: {
          Authorization: `Bearer ${token}`,
          ...(options.headers || {})
        }
      });
      if (res.status === 401) {
        clearDriveToken();
        const err = new Error("DRIVE_UNAUTHORIZED");
        err.code = "DRIVE_UNAUTHORIZED";
        throw err;
      }
      if (!res.ok) {
        const errBody = await res.text();
        throw new Error(`Błąd Dysku Google (${res.status}): ${errBody}`);
      }
      return res.json();
    }

    async function findOrCreateFolder(folderName, parentId, token) {
      const safeName = sanitizeDriveName(folderName) || "Bez nazwy";
      const escapedForQuery = safeName.replace(/'/g, "\\'");
      let query = `name='${escapedForQuery}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
      if (parentId) {
        query += ` and '${parentId}' in parents`;
      }

      const searchUrl = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)&spaces=drive`;
      const searchRes = await driveFetch(searchUrl, { method: "GET" }, token);

      if (searchRes.files && searchRes.files.length > 0) {
        return searchRes.files[0].id;
      }

      const body = {
        name: safeName,
        mimeType: "application/vnd.google-apps.folder"
      };
      if (parentId) {
        body.parents = [parentId];
      }

      const created = await driveFetch(
        "https://www.googleapis.com/drive/v3/files?fields=id,name",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        },
        token
      );
      return created.id;
    }

    async function getEventDriveFolderId(ev, token) {
      if (!cachedRootFolderId) {
        cachedRootFolderId = await findOrCreateFolder(ROOT_DRIVE_FOLDER_NAME, null, token);
      }
      const eventFolderName = `${ev.eventDate || todayStr()} - ${ev.name || "Impreza"}`;
      return await findOrCreateFolder(eventFolderName, cachedRootFolderId, token);
    }

    async function uploadFileToDrive(file, targetFileName, folderId, token) {
      const metadata = {
        name: sanitizeDriveName(targetFileName),
        parents: [folderId]
      };

      const boundary = "-------fort_drive_boundary_" + Date.now();
      const delimiter = `\r\n--${boundary}\r\n`;
      const closeDelimiter = `\r\n--${boundary}--`;

      const metadataPart =
        delimiter +
        "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
        JSON.stringify(metadata);

      const fileHeaderPart =
        delimiter +
        `Content-Type: ${file.type || "application/octet-stream"}\r\n\r\n`;

      const multipartBody = new Blob(
        [metadataPart, fileHeaderPart, file, closeDelimiter],
        { type: `multipart/related; boundary=${boundary}` }
      );

      return await driveFetch(
        "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink,webContentLink",
        {
          method: "POST",
          headers: {
            "Content-Type": `multipart/related; boundary=${boundary}`
          },
          body: multipartBody
        },
        token
      );
    }

    async function trashDriveFileQuietly(fileId, token) {
      if (!fileId || !token) return;
      try {
        await driveFetch(
          `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}`,
          {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ trashed: true })
          },
          token
        );
      } catch (_) {}
    }

    function triggerFilePicker(context) {

    hiddenFileInput.addEventListener("change", () => {

    async function processFileUpload(file, context) {
      const token = getValidDriveToken();
      if (!token) {
        showToastNeedReauth(file, context);
        return;
      }

      const ev = events.find((e) => e.id === context.eventId);
      if (!ev) return;

      const extMatch = (file.name || "").match(/\.[a-zA-Z0-9]+$/);
      const ext = extMatch ? extMatch[0].toLowerCase() : file.type === "application/pdf" ? ".pdf" : ".jpg";

      const docPrefix =
        context.docType === "opinion"
          ? `Opinia_${SERVICE_LABELS[context.serviceKey] || context.serviceKey}`
          : "Decyzja_UM";

      const targetFileName = `${docPrefix}_${todayStr()}${ext}`;

      try {
        showToastLoading(`Wysyłanie: ${docPrefix}...`);
        const folderId = await getEventDriveFolderId(ev, token);
        const uploaded = await uploadFileToDrive(file, targetFileName, folderId, token);

        const fileMeta = {
          id: uploaded.id,
          name: uploaded.name || targetFileName,
          webViewLink: uploaded.webViewLink || `https://drive.google.com/file/d/${uploaded.id}/view`,
          uploadedAt: new Date().toISOString()
        };

        if (context.docType === "opinion") {
          const oldFileId = ev.opinionFiles?.[context.serviceKey]?.id;
          await updateDoc(doc(db, "events", ev.id), {
            [`opinions.${context.serviceKey}`]: true,
            [`opinionFiles.${context.serviceKey}`]: fileMeta,
            updatedAt: new Date().toISOString(),
            updatedBy: currentUser.email
          });
          if (oldFileId && oldFileId !== uploaded.id) {
            trashDriveFileQuietly(oldFileId, token);
          }
        } else if (context.docType === "decision") {
          const oldFileId = ev.decisionFile?.id;
          await updateDoc(doc(db, "events", ev.id), {
            decisionReceived: true,
            decisionDate: todayStr(),
            decisionFile: fileMeta,
            updatedAt: new Date().toISOString(),
            updatedBy: currentUser.email
          });
          if (oldFileId && oldFileId !== uploaded.id) {
            trashDriveFileQuietly(oldFileId, token);
          }
        }

        showToastMessage(`Zapisano na Dysku Google: ${fileMeta.name}`, 3200);
      } catch (err) {
        if (err.code === "DRIVE_UNAUTHORIZED") {
          showToastNeedReauth(file, context);
        } else {
          console.error(err);
          showToastMessage(`Błąd wysyłania: ${err.message}`, 6000);
        }
      }
    }

    // =========================================================================
    // OBLICZANIE TERMINÓW I RENDEROWANIE
    // =========================================================================
    function getEventMetrics(ev) {
      const submitDeadline = addDays(ev.eventDate, -30);

      if (ev.decisionReceived) {
        return {
          status: "zakonczone",
          sortDays: 99999,
          urgent: false,
          submitDeadline
        };
      }

      if (!ev.submitted) {
        const daysLeft = diffDaysFromToday(submitDeadline);
        return {
          status: "do_zlozenia",
          daysLeft,
          sortDays: daysLeft,
          urgent: daysLeft < 2,
          submitDeadline
        };
      }

      const subBase = ev.submittedDate || todayStr();
      const opinionsDeadline = addDays(subBase, 14);
      const decisionDeadline = addDays(subBase, 30);
      const daysOpinions = diffDaysFromToday(opinionsDeadline);
      const daysDecision = diffDaysFromToday(decisionDeadline);

      const ops = ev.opinions || {};
      const allOpinionsDone = Boolean(ops.policja && ops.straz && ops.sanepid && ops.pogotowie);
      const activeDays = allOpinionsDone ? daysDecision : Math.min(daysOpinions, daysDecision);

      return {
        status: "zlozone",
        opinionsDeadline,
        decisionDeadline,
        daysOpinions,
        daysDecision,
        allOpinionsDone,
        sortDays: activeDays,
        urgent: activeDays < 2
      };
    }

    function formatDaysLabel(days) {
      if (days < 0) return `Po terminie (${Math.abs(days)} dni)`;
      if (days === 0) return "DZIŚ TERMIN!";
      if (days === 1) return "JUTRO (1 dzień)";
      return `Za ${days} dni`;
    }

    function render() {
      const q = searchQuery.trim().toLowerCase();
      const enriched = events.map((ev) => ({ ...ev, _m: getEventMetrics(ev) }));

      document.getElementById("count-do_zlozenia").textContent =
        enriched.filter((e) => e._m.status === "do_zlozenia").length;
      document.getElementById("count-zlozone").textContent =
        enriched.filter((e) => e._m.status === "zlozone").length;
      document.getElementById("count-zakonczone").textContent =
        enriched.filter((e) => e._m.status === "zakonczone").length;

      let filtered = enriched.filter((e) => e._m.status === currentTab);
      if (q) {
        filtered = filtered.filter(
          (e) =>
            (e.name || "").toLowerCase().includes(q) ||
            (e.location || "").toLowerCase().includes(q) ||
            (e.notes || "").toLowerCase().includes(q)
        );
      }

      if (currentTab === "zakonczone") {
        filtered.sort((a, b) => (b.eventDate || "").localeCompare(a.eventDate || ""));
      } else {
        filtered.sort((a, b) => a._m.sortDays - b._m.sortDays);
      }

      if (filtered.length === 0) {
        eventsList.innerHTML = `<div class="empty-state">Brak imprez w tej zakładce.</div>`;
        return;
      }

      eventsList.innerHTML = filtered.map((ev) => renderCard(ev)).join("");
    }

    function renderOpinionSlot(safeId, key, label, isDone, fileMeta) {
      const hasFile = Boolean(fileMeta && fileMeta.webViewLink);
      const uploaded = Boolean(isDone || hasFile);

      if (!uploaded) {
        return `
          <div class="opinion-slot">
            <div class="opinion-name"><span>${label}</span></div>
            <div class="slot-controls">
              <button type="button" class="plus-upload-btn"
                title="Dodaj zdjęcie, skan lub PDF (${label})"
                aria-label="Dodaj plik dla ${label}"
                data-action="upload-opinion" data-id="${safeId}" data-key="${key}">+</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="opinion-slot uploaded">
          <div class="opinion-name"><span>✓ ${label}</span></div>
          <div class="slot-controls">
            ${
              hasFile
                ? `<a href="${escapeHtml(fileMeta.webViewLink)}" target="_blank" rel="noopener" class="file-view-link" title="Otwórz zapisany plik na Dysku Google">📄 Skan</a>`
                : ""
            }
            <button type="button" class="plus-upload-btn small"
              title="Podmień plik (${label})"
              data-action="upload-opinion" data-id="${safeId}" data-key="${key}">+</button>
            <button type="button" class="file-remove-btn"
              title="Usuń załącznik (${label})"
              data-action="remove-opinion" data-id="${safeId}" data-key="${key}">✕</button>
          </div>
        </div>
      `;
    }

    function renderCard(ev) {
      const m = ev._m;
      const ops = ev.opinions || { policja: false, straz: false, sanepid: false, pogotowie: false };
      const opFiles = ev.opinionFiles || {};
      const safeId = escapeHtml(ev.id);

      let badgeHtml = "";
      let bodyHtml = "";

      if (m.status === "do_zlozenia") {
        const cls = m.urgent ? "badge-urgent" : m.daysLeft <= 5 ? "badge-warn" : "badge-ok";
        badgeHtml = `<span class="badge ${cls}">${formatDaysLabel(m.daysLeft)}</span>`;
        bodyHtml = `
          <div class="deadlines-box">
            <div class="deadline-row">
              <span>Termin złożenia (30 dni przed):</span>
              <strong>${formatDatePL(m.submitDeadline)}</strong>
            </div>
          </div>
          <div style="margin-top:10px;">
            <button type="button" class="btn-sm btn-primary" style="width:100%; padding:10px;"
              data-action="mark-submitted" data-id="${safeId}">
              ✓ Oznacz jako złożone dziś
            </button>
          </div>
        `;
      } else if (m.status === "zlozone") {
        const cls = m.urgent ? "badge-urgent" : m.sortDays <= 4 ? "badge-warn" : "badge-ok";
        badgeHtml = `<span class="badge ${cls}">${formatDaysLabel(m.sortDays)}</span>`;
        bodyHtml = `
          <div class="deadlines-box">
            <div class="deadline-row">
              <span>Złożono w urzędzie:</span>
              <strong>${formatDatePL(parseLocalDate(ev.submittedDate))}</strong>
            </div>
            <div class="deadline-row">
              <span>Opinie służb (14 dni):</span>
              <strong style="color:${!m.allOpinionsDone && m.daysOpinions < 2 ? "#fca5a5" : "inherit"}">
                ${formatDatePL(m.opinionsDeadline)} (${m.allOpinionsDone ? "komplet" : formatDaysLabel(m.daysOpinions)})
              </strong>
            </div>
            <div class="deadline-row">
              <span>Decyzja UM (30 dni):</span>
              <strong style="color:${m.daysDecision < 2 ? "#fca5a5" : "inherit"}">
                ${formatDatePL(m.decisionDeadline)} (${formatDaysLabel(m.daysDecision)})
              </strong>
            </div>
          </div>

          <div class="opinions-section-label">Opinie służb (kliknij +, aby wgrać zdjęcie, skan lub PDF):</div>
          <div class="opinions-grid">
            ${renderOpinionSlot(safeId, "policja", "Policja", ops.policja, opFiles.policja)}
            ${renderOpinionSlot(safeId, "straz", "Straż Pożarna", ops.straz, opFiles.straz)}
            ${renderOpinionSlot(safeId, "sanepid", "Sanepid", ops.sanepid, opFiles.sanepid)}
            ${renderOpinionSlot(safeId, "pogotowie", "Pogotowie", ops.pogotowie, opFiles.pogotowie)}
          </div>

          <div class="decision-box">
            <span>Decyzja UM (wgraj skan / PDF, aby zakończyć)</span>
            <button type="button" class="plus-upload-btn"
              title="Wgraj zdjęcie, skan lub PDF Decyzji UM"
              aria-label="Wgraj Decyzję UM"
              data-action="upload-decision" data-id="${safeId}">+</button>
          </div>
        `;
      } else {
        badgeHtml = `<span class="badge badge-done">Decyzja wydana</span>`;
        const decFile = ev.decisionFile;
        const opinionLinks = Object.entries(SERVICE_LABELS)
          .map(([key, label]) => {
            const f = opFiles[key];
            if (f && f.webViewLink) {
              return `<a href="${escapeHtml(f.webViewLink)}" target="_blank" rel="noopener" class="file-view-link">📄 ${label}</a>`;
            }
            if (ops[key]) {
              return `<span class="badge badge-done" style="font-size:11px;">${label} ✓</span>`;
            }
            return "";
          })
          .filter(Boolean)
          .join("");

        bodyHtml = `
          <div class="deadlines-box">
            <div class="deadline-row">
              <span>Złożono:</span>
              <strong>${formatDatePL(parseLocalDate(ev.submittedDate))}</strong>
            </div>
          </div>

          ${opinionLinks ? `<div class="archived-files-list">${opinionLinks}</div>` : ""}

          <div class="decision-box completed">
            <span>✓ Decyzja UM</span>
            <div class="slot-controls">
              ${
                decFile && decFile.webViewLink
                  ? `<a href="${escapeHtml(decFile.webViewLink)}" target="_blank" rel="noopener" class="file-view-link">📄 Otwórz decyzję</a>`
                  : ""
              }
              <button type="button" class="plus-upload-btn small"
                title="Podmień plik Decyzji UM"
                data-action="upload-decision" data-id="${safeId}">+</button>
              <button type="button" class="file-remove-btn"
                title="Usuń Decyzję UM i cofnij do Złożonych"
                data-action="remove-decision" data-id="${safeId}">✕</button>
            </div>
          </div>
        `;
      }

      return `
        <article class="card ${m.urgent ? "urgent" : ""}">
          <div class="card-header">
            <div>
              <h3 class="card-title">${escapeHtml(ev.name)}</h3>
              <div class="card-meta">
                📅 ${formatDatePL(parseLocalDate(ev.eventDate))}
                ${ev.location ? ` · 📍 ${escapeHtml(ev.location)}` : ""}
              </div>
            </div>
            ${badgeHtml}
          </div>
          ${ev.notes ? `<div style="font-size:12px; color:var(--text-muted); margin-top:6px;">📝 ${escapeHtml(ev.notes)}</div>` : ""}
          ${bodyHtml}
          <div class="card-actions">
            <button type="button" class="btn-sm" data-action="edit" data-id="${safeId}">Edytuj</button>
            <button type="button" class="btn-sm btn-danger" data-action="delete" data-id="${safeId}">Usuń</button>
          </div>
        </article>
      `;
    }

    // Delegacja zdarzeń na liście kart
    eventsList.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;

      const action = btn.dataset.action;
      const id = btn.dataset.id;

      if (action === "mark-submitted") {
        await updateDoc(doc(db, "events", id), {
          submitted: true,
          submittedDate: todayStr(),
          updatedAt: new Date().toISOString(),
          updatedBy: currentUser.email
        });
      } else if (action === "upload-opinion") {
        triggerFilePicker({
          eventId: id,
          docType: "opinion",
          serviceKey: btn.dataset.key
        });
      } else if (action === "remove-opinion") {
        const key = btn.dataset.key;
        const label = SERVICE_LABELS[key] || key;
        if (confirm(`Usunąć zapisaną opinię (${label})?`)) {
          const ev = events.find((item) => item.id === id);
          const oldFileId = ev?.opinionFiles?.[key]?.id;
          await updateDoc(doc(db, "events", id), {
            [`opinions.${key}`]: false,
            [`opinionFiles.${key}`]: deleteField(),
            updatedAt: new Date().toISOString(),
            updatedBy: currentUser.email
          });
          trashDriveFileQuietly(oldFileId, getValidDriveToken());
        }
      } else if (action === "upload-decision") {
        triggerFilePicker({
          eventId: id,
          docType: "decision"
        });
      } else if (action === "remove-decision") {
        if (confirm("Usunąć załącznik Decyzji UM i przenieść imprezę z powrotem do zakładki Złożone?")) {
          const ev = events.find((item) => item.id === id);
          const oldFileId = ev?.decisionFile?.id;
          await updateDoc(doc(db, "events", id), {
            decisionReceived: false,
            decisionDate: "",
            decisionFile: deleteField(),
            updatedAt: new Date().toISOString(),
            updatedBy: currentUser.email
          });
          trashDriveFileQuietly(oldFileId, getValidDriveToken());
        }
      } else if (action === "edit") {
        openEditModal(id);
      } else if (action === "delete") {
        if (confirm("Usunąć tę imprezę z bazy na wszystkich urządzeniach?")) {
          await deleteDoc(doc(db, "events", id));
        }
      }
    });

    // Obsługa modala dodawania / edycji
    const fSubmitted = document.getElementById("f-submitted");
    const subDateGroup = document.getElementById("submitted-date-group");

    fSubmitted.addEventListener("change", () => {
      subDateGroup.classList.toggle("hidden", !fSubmitted.checked);
      if (fSubmitted.checked && !document.getElementById("f-submittedDate").value) {
        document.getElementById("f-submittedDate").value = todayStr();
      }
    });

    document.getElementById("add-btn").addEventListener("click", () => {
      document.getElementById("modal-title").textContent = "Nowa impreza masowa";
      document.getElementById("edit-id").value = "";
      form.reset();
      subDateGroup.classList.add("hidden");
      modal.classList.add("open");
    });

    function openEditModal(id) {
      const ev = events.find((e) => e.id === id);
      if (!ev) return;
      document.getElementById("modal-title").textContent = "Edytuj imprezę";
      document.getElementById("edit-id").value = ev.id;
      document.getElementById("f-name").value = ev.name || "";
      document.getElementById("f-location").value = ev.location || "";
      document.getElementById("f-eventDate").value = ev.eventDate || "";
      document.getElementById("f-submitted").checked = Boolean(ev.submitted);
      document.getElementById("f-submittedDate").value = ev.submittedDate || todayStr();
      document.getElementById("f-notes").value = ev.notes || "";
      subDateGroup.classList.toggle("hidden", !ev.submitted);
      modal.classList.add("open");
    }

    document.getElementById("close-modal").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.remove("open");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("edit-id").value;
      const submitted = document.getElementById("f-submitted").checked;

      const payload = {
        name: document.getElementById("f-name").value.trim(),
        location: document.getElementById("f-location").value.trim(),
        eventDate: document.getElementById("f-eventDate").value,
        submitted,
        submittedDate: submitted ? (document.getElementById("f-submittedDate").value || todayStr()) : "",
        notes: document.getElementById("f-notes").value.trim(),
        updatedAt: new Date().toISOString(),
        updatedBy: currentUser.email
      };

      if (id) {
        await updateDoc(doc(db, "events", id), payload);
      } else {
        await addDoc(collection(db, "events"), {
          ...payload,
          opinions: { policja: false, straz: false, sanepid: false, pogotowie: false },
          decisionReceived: false,
          decisionDate: ""
        });
      }
      modal.classList.remove("open");
    });

    // Zakładki i wyszukiwanie
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.dataset.tab;
        render();
      });
    });

    document.getElementById("search-input").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      render();
    });

    // Powiadomienia o terminach poniżej 2 dni
    document.getElementById("notif-btn").addEventListener("click", async () => {
      if (!("Notification" in window)) {
        alert("Twoja przeglądarka nie obsługuje powiadomień push.");
        return;
      }
      const perm = await Notification.requestPermission();
      if (perm === "granted") {
        new Notification("Imprezy Masowe FORT", {
          body: "Powiadomienia o zbliżających się terminach są aktywne."
        });
      }
    });

    function checkUrgentNotifications() {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const urgentEvents = events.filter((ev) => getEventMetrics(ev).urgent);
      const notifyKey = `notified_${todayStr()}`;
      if (urgentEvents.length > 0 && !sessionStorage.getItem(notifyKey)) {
        sessionStorage.setItem(notifyKey, "1");
        new Notification(`Pilne terminy (${urgentEvents.length})`, {
          body: urgentEvents.map((e) => e.name).slice(0, 3).join(", ")
        });
      }
    }

    // Eksport kopii zapasowej JSON
    document.getElementById("export-btn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(events, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `imprezy-fort-${todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Jednorazowa migracja danych z poprzedniej wersji (localStorage)
    function findLegacyLocalEvents() {
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (!key || key.startsWith("firebase") || key.startsWith("fort_gdrive")) continue;
          const parsed = JSON.parse(localStorage.getItem(key));
          if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].eventDate && parsed[0].name) {
            return { key, items: parsed };
          }
        }
      } catch (_) {}
      return null;
    }

    function checkLocalMigration() {
      const legacy = findLegacyLocalEvents();
      if (legacy) {
        const banner = document.getElementById("migration-banner");
        banner.classList.remove("hidden");
        document.getElementById("migrate-btn").onclick = async () => {
          for (const item of legacy.items) {
            const { id, ...rest } = item;
            await addDoc(collection(db, "events"), {
              opinions: { policja: false, straz: false, sanepid: false, pogotowie: false },
              decisionReceived: false,
              ...rest,
              updatedAt: new Date().toISOString(),
              updatedBy: currentUser.email
            });
          }
          localStorage.removeItem(legacy.key);
          banner.classList.add("hidden");
        };
      }
    }
  </script>
</body>
</html>
