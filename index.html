<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Imprezy Masowe – FORT</title>

  <!-- Ustawienia PWA dla iPhone / Android -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Imprezy FORT" />
  <meta name="theme-color" content="#0f172a" />
  <link id="apple-icon" rel="apple-touch-icon" href="icon.png" />
  <link id="favicon-icon" rel="icon" type="image/png" href="icon.png" />

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273549;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --safe-top: env(safe-area-inset-top, 12px);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-top: var(--safe-top);
      padding-bottom: calc(88px + var(--safe-bottom));
      min-height: 100vh;
    }

    /* Ekran logowania */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      padding: 24px;
      text-align: center;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 390px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    .auth-logo {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, #1d4ed8, #0f172a);
      border: 1.5px solid #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 1px;
      color: #60a5fa;
    }

    .btn-google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 18px;
      margin-top: 20px;
      background: #ffffff;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-google:active {
      transform: scale(0.98);
    }

    /* Nagłówek aplikacji */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      max-width: 760px;
      margin: 0 auto;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
      flex-shrink: 0;
    }

    .sync-dot.online { background: var(--success); }
    .sync-dot.error { background: var(--danger); }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .search-bar {
      max-width: 760px;
      margin: 10px auto 0;
    }

    .search-bar input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--primary);
    }

    /* Zakładki */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 12px 16px 4px;
      max-width: 760px;
      margin: 0 auto;
    }

    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 6px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .tab-count {
      font-size: 11px;
      opacity: 0.9;
    }

    /* Lista kart */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px 16px;
    }

    .migration-banner {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid var(--primary);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    /* Migający czerwony alert dla terminów poniżej 2 dni */
    @keyframes pulseDanger {
      0%, 100% {
        border-color: #ef4444;
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45);
      }
      50% {
        border-color: #fca5a5;
        box-shadow: 0 0 14px 2px rgba(239, 68, 68, 0.65);
      }
    }

    @keyframes badgeBlink {
      0%, 100% { background-color: #dc2626; color: #ffffff; }
      50% { background-color: #7f1d1d; color: #fecaca; }
    }

    .card.urgent {
      animation: pulseDanger 1.4s infinite;
      border-width: 2px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .card-meta {
      font-size: 13px;
      color: var(--text-muted);
    }

    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-ok { background: rgba(16, 185, 129, 0.18); color: #34d399; }
    .badge-warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-urgent { animation: badgeBlink 1.1s infinite; }
    .badge-done { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }

    .deadlines-box {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 12px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .deadline-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .opinions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .check-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .check-pill input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--success);
      margin: 0;
    }

    .check-pill.checked {
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.1);
    }

    .decision-box {
      margin-top: 10px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.4);
      padding: 10px 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .btn-sm {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-danger {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* Przycisk dodawania (+) */
    .fab {
      position: fixed;
      right: 20px;
      bottom: calc(20px + var(--safe-bottom));
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      font-size: 30px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.5);
      cursor: pointer;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 50;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 600px;
      padding: 20px 20px calc(24px + var(--safe-bottom));
      max-height: 92vh;
      overflow-y: auto;
    }

    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; }
      .modal { border-radius: 20px; border: 1px solid var(--border); }
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- EKRAN LOGOWANIA -->
  <section id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">FORT</div>
      <h1 style="margin: 0 0 8px; font-size: 22px;">Imprezy Masowe</h1>
      <p style="margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.5;">
        Zaloguj się kontem Google, aby synchronizować dokumentację i terminy między iPhonem a komputerem.
      </p>
      <button id="login-btn" type="button" class="btn-google">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Zaloguj przez Google
      </button>
      <p id="auth-error" style="color: #fca5a5; font-size: 13px; margin-top: 14px; line-height: 1.4;"></p>
    </div>
  </section>

  <!-- GŁÓWNA APLIKACJA -->
  <div id="app-shell" class="hidden">
    <header>
      <div class="header-top">
        <div>
          <h1 class="header-title">Imprezy Masowe</h1>
          <div class="sync-status">
            <span id="sync-dot" class="sync-dot"></span>
            <span id="sync-text">Łączenie z chmurą...</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="notif-btn" type="button" class="icon-btn" title="Powiadomienia">🔔</button>
          <button id="export-btn" type="button" class="icon-btn" title="Pobierz kopię JSON">⬇️</button>
          <button id="logout-btn" type="button" class="icon-btn" title="Wyloguj">Wyloguj</button>
        </div>
      </div>
      <div class="search-bar">
        <input type="search" id="search-input" placeholder="Szukaj imprezy, obiektu lub uwag..." />
      </div>
    </header>

    <nav class="tabs">
      <button type="button" class="tab-btn active" data-tab="do_zlozenia">
        <span>Do złożenia</span>
        <span class="tab-count" id="count-do_zlozenia">0</span>
      </button>
      <button type="button" class="tab-btn" data-tab="zlozone">
        <span>Złożone</span>
        <span class="tab-count" id="count-zlozone">0</span>
      </button>
      <button type="button" class="tab-btn" data-tab="zakonczone">
        <span>Zakończone</span>
        <span class="tab-count" id="count-zakonczone">0</span>
      </button>
    </nav>

    <main>
      <div id="migration-banner" class="migration-banner hidden">
        <span>Wykryto lokalne zapisy na tym urządzeniu.</span>
        <button id="migrate-btn" type="button" class="btn-sm btn-primary">Wyślij do chmury</button>
      </div>

      <div id="events-list"></div>
    </main>

    <button id="add-btn" type="button" class="fab" aria-label="Dodaj imprezę">+</button>
  </div>

  <!-- MODAL DODAWANIA / EDYCJI -->
  <div id="event-modal" class="modal-backdrop">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 id="modal-title" style="margin:0; font-size:18px;">Nowa impreza masowa</h2>
        <button id="close-modal" type="button" class="icon-btn">✕</button>
      </div>
      <form id="event-form">
        <input type="hidden" id="edit-id" />
        <div class="form-group">
          <label for="f-name">Nazwa imprezy *</label>
          <input type="text" id="f-name" required placeholder="np. Koncert – ERGO ARENA" />
        </div>
        <div class="form-group">
          <label for="f-location">Obiekt / Miasto</label>
          <input type="text" id="f-location" placeholder="np. Gdańsk / Szczecin" />
        </div>
        <div class="form-group">
          <label for="f-eventDate">Data imprezy *</label>
          <input type="date" id="f-eventDate" required />
        </div>
        <div class="form-group">
          <label style="display:flex; align-items:center; gap:8px; color:var(--text); cursor:pointer;">
            <input type="checkbox" id="f-submitted" style="width:18px; height:18px;" />
            Wniosek został już złożony w urzędzie
          </label>
        </div>
        <div class="form-group hidden" id="submitted-date-group">
          <label for="f-submittedDate">Data złożenia wniosku</label>
          <input type="date" id="f-submittedDate" />
        </div>
        <div class="form-group">
          <label for="f-notes">Uwagi / Nr sprawy</label>
          <textarea id="f-notes" rows="2" placeholder="Opcjonalne informacje..."></textarea>
        </div>
        <button type="submit" class="btn-sm btn-primary" style="width:100%; padding:14px; font-size:16px;">
          Zapisz w chmurze
        </button>
      </form>
    </div>
  </div>

  <!-- FIREBASE SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      initializeFirestore,
      persistentLocalCache,
      persistentMultipleTabManager,
      collection,
      doc,
      addDoc,
      updateDoc,
      deleteDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // Konfiguracja Twojego projektu Firebase (imprezymasowe-3d484)
    const firebaseConfig = {
      apiKey: "AIzaSyCcTIeCemSltj9WiybdwvXDKEUrst5Ivbc",
      authDomain: "imprezymasowe-3d484.firebaseapp.com",
      projectId: "imprezymasowe-3d484",
      storageBucket: "imprezymasowe-3d484.firebasestorage.app",
      messagingSenderId: "842662033888",
      appId: "1:842662033888:web:60536e6a5ed6a6ded09385",
      measurementId: "G-B0R7GZRW0G"
    };

    // Autoryzowane konta Google
    const ALLOWED_EMAILS = [
      "irek1987.pl@gmail.com"
    ];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(() => {});

    // Pamięć offline obsługująca wiele kart i aplikację na ekranie głównym iOS
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({
        tabManager: persistentMultipleTabManager()
      })
    });

    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    // Generowanie ikony startowej PWA dla iPhone jeśli brak osobnego pliku icon.png
    (function ensureAppleIcon() {
      const c = document.createElement("canvas");
      c.width = 180;
      c.height = 180;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, 180, 180);
      ctx.strokeStyle = "#3b82f6";
      ctx.lineWidth = 8;
      ctx.strokeRect(14, 14, 152, 152);
      ctx.fillStyle = "#60a5fa";
      ctx.font = "bold 44px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("FORT", 90, 92);

      const dataUrl = c.toDataURL("image/png");
      const appleLink = document.getElementById("apple-icon");
      const favLink = document.getElementById("favicon-icon");

      fetch("icon.png", { method: "HEAD" })
        .then((r) => {
          if (!r.ok) {
            appleLink.href = dataUrl;
            favLink.href = dataUrl;
          }
        })
        .catch(() => {
          appleLink.href = dataUrl;
          favLink.href = dataUrl;
        });
    })();

    // Stan aplikacji
    let events = [];
    let currentTab = "do_zlozenia";
    let searchQuery = "";
    let unsubscribeSnapshot = null;
    let currentUser = null;

    // Elementy DOM
    const authScreen = document.getElementById("auth-screen");
    const appShell = document.getElementById("app-shell");
    const authError = document.getElementById("auth-error");
    const syncDot = document.getElementById("sync-dot");
    const syncText = document.getElementById("sync-text");
    const eventsList = document.getElementById("events-list");
    const modal = document.getElementById("event-modal");
    const form = document.getElementById("event-form");

    // Pomocnicze funkcje dat (lokalne, bez przesunięć stref czasowych)
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function parseLocalDate(str) {
      if (!str) return null;
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(dateStr, days) {
      const d = parseLocalDate(dateStr);
      if (!d) return null;
      d.setDate(d.getDate() + days);
      return d;
    }

    function formatDatePL(dateObj) {
      if (!dateObj) return "—";
      return dateObj.toLocaleDateString("pl-PL", { day: "2-digit", month: "2-digit", year: "numeric" });
    }

    function diffDaysFromToday(targetDate) {
      if (!targetDate) return 0;
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.round((targetDate - today) / (1000 * 60 * 60 * 24));
    }

    function escapeHtml(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatAuthError(err) {
      const code = err?.code || "";
      if (code === "auth/unauthorized-domain") {
        return "Domena GitHub Pages nie jest dodana w Firebase -> Authentication -> Settings -> Authorized domains.";
      }
      if (code === "auth/popup-blocked") {
        return "Przeglądarka zablokowała okno logowania. Zezwól na wyskakujące okna w ustawieniach Safari/przeglądarki.";
      }
      if (code === "auth/popup-closed-by-user") {
        return "Zamknięto okno logowania przed zakończeniem.";
      }
      if (code === "auth/invalid-api-key") {
        return "Nieprawidłowy klucz apiKey w konfiguracji firebaseConfig.";
      }
      return "Błąd logowania: " + (err?.message || code);
    }

    // Logowanie Google (wywoływane bezpośrednio w zdarzeniu click dla zgodności z Safari iOS)
    document.getElementById("login-btn").addEventListener("click", () => {
      authError.textContent = "";
      signInWithPopup(auth, provider).catch((err) => {
        authError.textContent = formatAuthError(err);
      });
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      if (unsubscribeSnapshot) {
        unsubscribeSnapshot();
        unsubscribeSnapshot = null;
      }
      signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        const userEmail = (user.email || "").toLowerCase();
        const allowedLower = ALLOWED_EMAILS.map((e) => e.toLowerCase());
        if (allowedLower.length > 0 && !allowedLower.includes(userEmail)) {
          authError.textContent = `Brak uprawnień dla konta: ${user.email}`;
          signOut(auth);
          return;
        }
        currentUser = user;
        authScreen.classList.add("hidden");
        appShell.classList.remove("hidden");
        checkLocalMigration();
        startRealtimeSync();
      } else {
        currentUser = null;
        appShell.classList.add("hidden");
        authScreen.classList.remove("hidden");
      }
    });

    // Synchronizacja w czasie rzeczywistym z Cloud Firestore
    function startRealtimeSync() {
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      const colRef = collection(db, "events");
      unsubscribeSnapshot = onSnapshot(
        colRef,
        { includeMetadataChanges: true },
        (snapshot) => {
          events = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
          const fromCache = snapshot.metadata.fromCache;
          syncDot.className = "sync-dot " + (fromCache ? "" : "online");
          syncText.textContent = fromCache
            ? "Tryb offline (zapis lokalny)"
            : `Zsynchronizowano (${currentUser.email})`;
          render();
          checkUrgentNotifications();
        },
        (error) => {
          syncDot.className = "sync-dot error";
          syncText.textContent =
            error.code === "permission-denied"
              ? "Brak uprawnień w regułach Firestore"
              : "Błąd połączenia z bazą";
          console.error(error);
        }
      );
    }

    // Obliczanie terminów
    function getEventMetrics(ev) {
      const submitDeadline = addDays(ev.eventDate, -30);

      if (ev.decisionReceived) {
        return {
          status: "zakonczone",
          sortDays: 99999,
          urgent: false,
          submitDeadline
        };
      }

      if (!ev.submitted) {
        const daysLeft = diffDaysFromToday(submitDeadline);
        return {
          status: "do_zlozenia",
          daysLeft,
          sortDays: daysLeft,
          urgent: daysLeft < 2,
          submitDeadline
        };
      }

      const subBase = ev.submittedDate || todayStr();
      const opinionsDeadline = addDays(subBase, 14);
      const decisionDeadline = addDays(subBase, 30);
      const daysOpinions = diffDaysFromToday(opinionsDeadline);
      const daysDecision = diffDaysFromToday(decisionDeadline);

      const ops = ev.opinions || {};
      const allOpinionsDone = Boolean(ops.policja && ops.straz && ops.sanepid && ops.pogotowie);
      const activeDays = allOpinionsDone ? daysDecision : Math.min(daysOpinions, daysDecision);

      return {
        status: "zlozone",
        opinionsDeadline,
        decisionDeadline,
        daysOpinions,
        daysDecision,
        allOpinionsDone,
        sortDays: activeDays,
        urgent: activeDays < 2
      };
    }

    function formatDaysLabel(days) {
      if (days < 0) return `Po terminie (${Math.abs(days)} dni)`;
      if (days === 0) return "DZIŚ TERMIN!";
      if (days === 1) return "JUTRO (1 dzień)";
      return `Za ${days} dni`;
    }

    // Renderowanie widoku
    function render() {
      const q = searchQuery.trim().toLowerCase();
      const enriched = events.map((ev) => ({ ...ev, _m: getEventMetrics(ev) }));

      document.getElementById("count-do_zlozenia").textContent =
        enriched.filter((e) => e._m.status === "do_zlozenia").length;
      document.getElementById("count-zlozone").textContent =
        enriched.filter((e) => e._m.status === "zlozone").length;
      document.getElementById("count-zakonczone").textContent =
        enriched.filter((e) => e._m.status === "zakonczone").length;

      let filtered = enriched.filter((e) => e._m.status === currentTab);
      if (q) {
        filtered = filtered.filter(
          (e) =>
            (e.name || "").toLowerCase().includes(q) ||
            (e.location || "").toLowerCase().includes(q) ||
            (e.notes || "").toLowerCase().includes(q)
        );
      }

      if (currentTab === "zakonczone") {
        filtered.sort((a, b) => (b.eventDate || "").localeCompare(a.eventDate || ""));
      } else {
        filtered.sort((a, b) => a._m.sortDays - b._m.sortDays);
      }

      if (filtered.length === 0) {
        eventsList.innerHTML = `<div class="empty-state">Brak imprez w tej zakładce.</div>`;
        return;
      }

      eventsList.innerHTML = filtered.map((ev) => renderCard(ev)).join("");
    }

    function renderCard(ev) {
      const m = ev._m;
      const ops = ev.opinions || { policja: false, straz: false, sanepid: false, pogotowie: false };
      const safeId = escapeHtml(ev.id);

      let badgeHtml = "";
      let bodyHtml = "";

      if (m.status === "do_zlozenia") {
        const cls = m.urgent ? "badge-urgent" : m.daysLeft <= 5 ? "badge-warn" : "badge-ok";
        badgeHtml = `<span class="badge ${cls}">${formatDaysLabel(m.daysLeft)}</span>`;
        bodyHtml = `
          <div class="deadlines-box">
            <div class="deadline-row">
              <span>Termin złożenia (30 dni przed):</span>
              <strong>${formatDatePL(m.submitDeadline)}</strong>
            </div>
          </div>
          <div style="margin-top:10px;">
            <button type="button" class="btn-sm btn-primary" style="width:100%; padding:10px;"
              data-action="mark-submitted" data-id="${safeId}">
              ✓ Oznacz jako złożone dziś
            </button>
          </div>
        `;
      } else if (m.status === "zlozone") {
        const cls = m.urgent ? "badge-urgent" : m.sortDays <= 4 ? "badge-warn" : "badge-ok";
        badgeHtml = `<span class="badge ${cls}">${formatDaysLabel(m.sortDays)}</span>`;
        bodyHtml = `
          <div class="deadlines-box">
            <div class="deadline-row">
              <span>Złożono w urzędzie:</span>
              <strong>${formatDatePL(parseLocalDate(ev.submittedDate))}</strong>
            </div>
            <div class="deadline-row">
              <span>Opinie służb (14 dni):</span>
              <strong style="color:${!m.allOpinionsDone && m.daysOpinions < 2 ? "#fca5a5" : "inherit"}">
                ${formatDatePL(m.opinionsDeadline)} (${m.allOpinionsDone ? "komplet" : formatDaysLabel(m.daysOpinions)})
              </strong>
            </div>
            <div class="deadline-row">
              <span>Decyzja UM (30 dni):</span>
              <strong style="color:${m.daysDecision < 2 ? "#fca5a5" : "inherit"}">
                ${formatDatePL(m.decisionDeadline)} (${formatDaysLabel(m.daysDecision)})
              </strong>
            </div>
          </div>

          <div class="opinions-grid">
            ${renderOpinionCheckbox(safeId, "policja", "Policja", ops.policja)}
            ${renderOpinionCheckbox(safeId, "straz", "Straż Pożarna", ops.straz)}
            ${renderOpinionCheckbox(safeId, "sanepid", "Sanepid", ops.sanepid)}
            ${renderOpinionCheckbox(safeId, "pogotowie", "Pogotowie", ops.pogotowie)}
          </div>

          <label class="decision-box">
            <span>Otrzymano Decyzję UM (archiwizuj)</span>
            <input type="checkbox" style="width:20px; height:20px; accent-color:#10b981;"
              data-action="toggle-decision" data-id="${safeId}" />
          </label>
        `;
      } else {
        badgeHtml = `<span class="badge badge-done">Decyzja wydana</span>`;
        bodyHtml = `
          <div class="deadlines-box">
            <div class="deadline-row">
              <span>Złożono:</span>
              <strong>${formatDatePL(parseLocalDate(ev.submittedDate))}</strong>
            </div>
            <div class="deadline-row">
              <span>Opinie:</span>
              <span>Policja ✓ · PSP ✓ · Sanepid ✓ · Pogotowie ✓</span>
            </div>
          </div>
          <label class="decision-box" style="background:rgba(16,185,129,0.12); border-color:rgba(16,185,129,0.4);">
            <span>Decyzja UM odebrana</span>
            <input type="checkbox" checked style="width:20px; height:20px; accent-color:#10b981;"
              data-action="toggle-decision" data-id="${safeId}" />
          </label>
        `;
      }

      return `
        <article class="card ${m.urgent ? "urgent" : ""}">
          <div class="card-header">
            <div>
              <h3 class="card-title">${escapeHtml(ev.name)}</h3>
              <div class="card-meta">
                📅 ${formatDatePL(parseLocalDate(ev.eventDate))}
                ${ev.location ? ` · 📍 ${escapeHtml(ev.location)}` : ""}
              </div>
            </div>
            ${badgeHtml}
          </div>
          ${ev.notes ? `<div style="font-size:12px; color:var(--text-muted); margin-top:6px;">📝 ${escapeHtml(ev.notes)}</div>` : ""}
          ${bodyHtml}
          <div class="card-actions">
            <button type="button" class="btn-sm" data-action="edit" data-id="${safeId}">Edytuj</button>
            <button type="button" class="btn-sm btn-danger" data-action="delete" data-id="${safeId}">Usuń</button>
          </div>
        </article>
      `;
    }

    function renderOpinionCheckbox(safeId, key, label, checked) {
      return `
        <label class="check-pill ${checked ? "checked" : ""}">
          <input type="checkbox" ${checked ? "checked" : ""}
            data-action="toggle-opinion" data-id="${safeId}" data-key="${key}" />
          <span>${label}</span>
        </label>
      `;
    }

    // Delegacja zdarzeń na liście kart
    eventsList.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn || btn.tagName === "INPUT") return;

      const action = btn.dataset.action;
      const id = btn.dataset.id;

      if (action === "mark-submitted") {
        await updateDoc(doc(db, "events", id), {
          submitted: true,
          submittedDate: todayStr(),
          updatedAt: new Date().toISOString(),
          updatedBy: currentUser.email
        });
      } else if (action === "edit") {
        openEditModal(id);
      } else if (action === "delete") {
        if (confirm("Usunąć tę imprezę z bazy na wszystkich urządzeniach?")) {
          await deleteDoc(doc(db, "events", id));
        }
      }
    });

    eventsList.addEventListener("change", async (e) => {
      const input = e.target.closest("input[data-action]");
      if (!input) return;

      const action = input.dataset.action;
      const id = input.dataset.id;

      if (action === "toggle-opinion") {
        const key = input.dataset.key;
        await updateDoc(doc(db, "events", id), {
          [`opinions.${key}`]: input.checked,
          updatedAt: new Date().toISOString(),
          updatedBy: currentUser.email
        });
      } else if (action === "toggle-decision") {
        await updateDoc(doc(db, "events", id), {
          decisionReceived: input.checked,
          decisionDate: input.checked ? todayStr() : "",
          updatedAt: new Date().toISOString(),
          updatedBy: currentUser.email
        });
      }
    });

    // Obsługa modala dodawania / edycji
    const fSubmitted = document.getElementById("f-submitted");
    const subDateGroup = document.getElementById("submitted-date-group");

    fSubmitted.addEventListener("change", () => {
      subDateGroup.classList.toggle("hidden", !fSubmitted.checked);
      if (fSubmitted.checked && !document.getElementById("f-submittedDate").value) {
        document.getElementById("f-submittedDate").value = todayStr();
      }
    });

    document.getElementById("add-btn").addEventListener("click", () => {
      document.getElementById("modal-title").textContent = "Nowa impreza masowa";
      document.getElementById("edit-id").value = "";
      form.reset();
      subDateGroup.classList.add("hidden");
      modal.classList.add("open");
    });

    function openEditModal(id) {
      const ev = events.find((e) => e.id === id);
      if (!ev) return;
      document.getElementById("modal-title").textContent = "Edytuj imprezę";
      document.getElementById("edit-id").value = ev.id;
      document.getElementById("f-name").value = ev.name || "";
      document.getElementById("f-location").value = ev.location || "";
      document.getElementById("f-eventDate").value = ev.eventDate || "";
      document.getElementById("f-submitted").checked = Boolean(ev.submitted);
      document.getElementById("f-submittedDate").value = ev.submittedDate || todayStr();
      document.getElementById("f-notes").value = ev.notes || "";
      subDateGroup.classList.toggle("hidden", !ev.submitted);
      modal.classList.add("open");
    }

    document.getElementById("close-modal").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.remove("open");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("edit-id").value;
      const submitted = document.getElementById("f-submitted").checked;

      const payload = {
        name: document.getElementById("f-name").value.trim(),
        location: document.getElementById("f-location").value.trim(),
        eventDate: document.getElementById("f-eventDate").value,
        submitted,
        submittedDate: submitted ? (document.getElementById("f-submittedDate").value || todayStr()) : "",
        notes: document.getElementById("f-notes").value.trim(),
        updatedAt: new Date().toISOString(),
        updatedBy: currentUser.email
      };

      if (id) {
        await updateDoc(doc(db, "events", id), payload);
      } else {
        await addDoc(collection(db, "events"), {
          ...payload,
          opinions: { policja: false, straz: false, sanepid: false, pogotowie: false },
          decisionReceived: false,
          decisionDate: ""
        });
      }
      modal.classList.remove("open");
    });

    // Zakładki i wyszukiwanie
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.dataset.tab;
        render();
      });
    });

    document.getElementById("search-input").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      render();
    });

    // Powiadomienia o terminach poniżej 2 dni
    document.getElementById("notif-btn").addEventListener("click", async () => {
      if (!("Notification" in window)) {
        alert("Twoja przeglądarka nie obsługuje powiadomień push.");
        return;
      }
      const perm = await Notification.requestPermission();
      if (perm === "granted") {
        new Notification("Imprezy Masowe FORT", {
          body: "Powiadomienia o zbliżających się terminach są aktywne."
        });
      }
    });

    function checkUrgentNotifications() {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const urgentEvents = events.filter((ev) => getEventMetrics(ev).urgent);
      const notifyKey = `notified_${todayStr()}`;
      if (urgentEvents.length > 0 && !sessionStorage.getItem(notifyKey)) {
        sessionStorage.setItem(notifyKey, "1");
        new Notification(`Pilne terminy (${urgentEvents.length})`, {
          body: urgentEvents.map((e) => e.name).slice(0, 3).join(", ")
        });
      }
    }

    // Eksport kopii zapasowej JSON
    document.getElementById("export-btn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(events, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `imprezy-fort-${todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Jednorazowa migracja danych z poprzedniej wersji (localStorage)
    function findLegacyLocalEvents() {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || key.startsWith("firebase")) continue;
        try {
          const parsed = JSON.parse(localStorage.getItem(key));
          if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].eventDate && parsed[0].name) {
            return { key, items: parsed };
          }
        } catch (_) {}
      }
      return null;
    }

    function checkLocalMigration() {
      const legacy = findLegacyLocalEvents();
      if (legacy) {
        const banner = document.getElementById("migration-banner");
        banner.classList.remove("hidden");
        document.getElementById("migrate-btn").onclick = async () => {
          for (const item of legacy.items) {
            const { id, ...rest } = item;
            await addDoc(collection(db, "events"), {
              opinions: { policja: false, straz: false, sanepid: false, pogotowie: false },
              decisionReceived: false,
              ...rest,
              updatedAt: new Date().toISOString(),
              updatedBy: currentUser.email
            });
          }
          localStorage.removeItem(legacy.key);
          banner.classList.add("hidden");
        };
      }
    }
  </script>
</body>
</html>
